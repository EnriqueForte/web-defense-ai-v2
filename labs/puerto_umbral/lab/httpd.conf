ServerRoot "/usr/local/apache2"
Listen 8080
ServerName 127.0.0.1
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
User #10001
Group #10001
PidFile /tmp/httpd.pid
Mutex file:/tmp default
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"rid:%{X-Request-ID}i\"" umbral
CustomLog /proc/self/fd/1 umbral
ServerTokens Prod
ServerSignature Off
Timeout 5
KeepAlive Off
LimitRequestLine 4096
LimitRequestBody 2048
LimitRequestFields 20
ProxyRequests Off
ProxyAddHeaders Off
ProxyTimeout 4
DocumentRoot /usr/local/apache2/htdocs
DirectoryIndex index.html
TypesConfig conf/mime.types
ProxyPass /mercancias "unix:/run/umbral/sqli/backend.sock|http://localhost/mercancias" retry=0 timeout=4
ProxyPass /comunicaciones "unix:/run/umbral/xss/backend.sock|http://localhost/comunicaciones" retry=0 timeout=4
ProxyPass /archivo "unix:/run/umbral/traversal/backend.sock|http://localhost/archivo" retry=0 timeout=4
ProxyPass /mantenimiento "unix:/run/umbral/command/backend.sock|http://localhost/mantenimiento" retry=0 timeout=4
ProxyPass /login "unix:/run/umbral/brute/backend.sock|http://localhost/login" retry=0 timeout=4
ProxyPass /avanzado "unix:/run/umbral/advanced/backend.sock|http://localhost/avanzado" retry=0 timeout=4
<Directory /usr/local/apache2/htdocs>
    Require all granted
    Options -Indexes
</Directory>
Header always set X-Content-Type-Options "nosniff"
<Location />
    Require all granted
</Location>
