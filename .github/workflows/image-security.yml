name: Remote laboratory image inventory

on:
  workflow_dispatch:
    inputs:
      image_set:
        description: Inventory or isolated Mailpit candidate review
        type: choice
        options: [inventory, mailpit-review]
        default: inventory
  push:
    branches: [main]
    paths:
      - .github/workflows/image-security.yml
      - scripts/scan_lab_images.py
      - scripts/check_mailpit_compat.py

permissions:
  contents: read

jobs:
  remote-image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download verified Trivy Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-tool"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/trivy-tool/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  '"$RUNNER_TEMP/trivy-tool/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy-tool/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-tool" trivy
      - name: Scan declared images from remote registries
        env:
          IMAGE_SET: ${{ inputs.image_set || 'inventory' }}
        run: python -B scripts/scan_lab_images.py --trivy "$RUNNER_TEMP/trivy-tool/trivy" --image-set "$IMAGE_SET"
      - name: Isolated Mailpit SMTP and API compatibility
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_set == 'mailpit-review' }}
        run: |
          python -m venv .local-state/mailpit-tool
          .local-state/mailpit-tool/bin/python -m pip install -r requirements-bootstrap.txt
          .local-state/mailpit-tool/bin/python -m pip install requests==2.33.1 python-dotenv==1.2.2
          .local-state/mailpit-tool/bin/python -B scripts/check_mailpit_compat.py --run --scan-dir .local-state/image-audit
      - name: Save image reports and resolved digests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-image-security
          path: |
            .local-state/image-audit/*.json
            .local-state/image-audit/scanner-version.txt
            .local-state/mailpit-review/*.json
            .local-state/mailpit-review/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
